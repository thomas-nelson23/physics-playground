[package]
name = "tonefield"
version = "0.1.0"
description = "Interactive physics and algorithm visualizer"
edition = "2021"

[lib]
name = "tonefield_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.10"
